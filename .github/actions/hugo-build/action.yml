name: Hugo Build
description: Checkout, setup Hugo, and build the site with minification.
runs:
  using: "composite"
  steps:
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.168.0'
        extended: true

    - name: Build with Hugo
      run: hugo --minify
      shell: bash
